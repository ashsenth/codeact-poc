name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # CI never runs live-model or Hyperlight-runtime tests.
  ENABLE_LIVE_TESTS: "false"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Test (exclude live + Hyperlight) with coverage
        run: >
          dotnet test -c Release --no-build
          --filter "Category!=LiveModel&Category!=Hyperlight"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ./TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Dependency vulnerability scan
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -Eiq "(Critical|High|Moderate|Low)" vuln.txt; then
            echo "::error::Vulnerable NuGet packages detected."
            exit 1
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
